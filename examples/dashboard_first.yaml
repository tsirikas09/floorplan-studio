# Παράδειγμα dashboard (Πρώτος όροφος). Η πρώτη κάρτα είναι η κάρτα του Floorplan Studio, οι υπόλοιπες είναι τα popups (Bubble Card >= 3.2 + Mushroom).
# Επικόλληση: νέο dashboard -> Επεξεργασία -> τρεις τελείες -> Raw configuration editor.
# Αν δεν έχεις Kiosk Mode ή το θέμα atelier, σβήσε τις γραμμές kiosk_mode και theme.
title: Πρώτος όροφος
kiosk_mode:
  kiosk: true
views:
- title: Κάτοψη
  path: floorplan
  icon: mdi:floor-plan
  type: sections
  theme: atelier
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:floorplan-studio-card
      floor: u
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#u_bedroom'
      name: Υπνοδωμάτιο
      icon: mdi:bed
      grid_options:
        columns: full
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Φωτισμός και έλεγχοι
        icon: mdi:lightbulb-outline
        grid_options:
          columns: 12
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:mushroom-light-card
          entity: light.bedroom_bd_light_r
          name: Φως R υπνοδωματίου
          show_brightness_control: true
          use_light_color: true
          collapsible_controls: true
          grid_options:
            columns: 12
        - type: custom:mushroom-light-card
          entity: light.bedroom_bd_light_l
          name: Φως L υπνοδωματίου
          show_brightness_control: true
          use_light_color: true
          collapsible_controls: true
          grid_options:
            columns: 12
        - type: custom:mushroom-light-card
          entity: light.dim_light_1u_bd_light_1
          name: Φως 1 (dimmer)
          show_brightness_control: true
          use_light_color: true
          collapsible_controls: true
          grid_options:
            columns: 12
        grid_options:
          columns: 12
          rows: auto
      - type: custom:mushroom-climate-card
        entity: climate.todo_u_ac_1
        name: Κλιματιστικό υπνοδωματίου
        show_temperature_control: true
        collapsible_controls: true
        hvac_modes:
        - 'off'
        - heat
        - cool
        - auto
        - dry
        - fan_only
        grid_options:
          columns: 12
          rows: auto
      - type: custom:bubble-card
        card_type: separator
        name: Πρίζες
        icon: mdi:power-socket-eu
        grid_options:
          columns: 12
      - type: grid
        columns: 2
        square: false
        cards:
        - type: conditional
          conditions:
          - &id001
            condition: numeric_state
            entity: sensor.bd_socket_r_power
            above: 2
          card:
