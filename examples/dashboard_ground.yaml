# Παράδειγμα dashboard (Ισόγειο). Η πρώτη κάρτα είναι η κάρτα του Floorplan Studio, οι υπόλοιπες είναι τα popups (Bubble Card >= 3.2 + Mushroom).
# Επικόλληση: νέο dashboard -> Επεξεργασία -> τρεις τελείες -> Raw configuration editor.
# Αν δεν έχεις Kiosk Mode ή το θέμα atelier, σβήσε τις γραμμές kiosk_mode και theme.
title: Ισόγειο
kiosk_mode:
  kiosk: true
views:
- title: Κάτοψη
  path: floorplan
  icon: mdi:floor-plan
  type: sections
  theme: atelier
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:floorplan-studio-card
      floor: g
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#g_bedroom'
      name: Υπνοδωμάτιο
      icon: mdi:bed
      grid_options:
        columns: full
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: Φωτισμός και έλεγχοι
        icon: mdi:lightbulb-outline
        grid_options:
          columns: 12
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:mushroom-light-card
          entity: light.bedroom_bd_light_1
          name: Φως 1 υπνοδωματίου
          show_brightness_control: true
          use_light_color: true
          collapsible_controls: true
          grid_options:
            columns: 12
        - type: custom:mushroom-light-card
          entity: light.bedroom_bd_light_ontas_2
          name: Φως 2 υπνοδωματίου
          show_brightness_control: true
          use_light_color: true
          collapsible_controls: true
          grid_options:
            columns: 12
        - type: custom:mushroom-light-card
          entity: light.wled_gledopto_2
          name: LED υπνοδωματίου
          show_brightness_control: true
          use_light_color: true
          collapsible_controls: true
          grid_options:
            columns: 12
        grid_options:
          columns: 12
          rows: auto
      - type: custom:bubble-card
        card_type: separator
        name: Πρίζες
        icon: mdi:power-socket-eu
        grid_options:
          columns: 12
      - type: grid
        columns: 2
        square: false
        cards:
        - type: conditional
          conditions:
          - &id001
            condition: numeric_state
            entity: sensor.bd_socket_1_power
            above: 2
          card:
            type: custom:mushroom-template-card
            entity: switch.bd_socket_1
            primary: Πρίζα 1 υπνοδωματίου
            secondary: '{{ ''Ανοιχτό'' if is_state(''switch.bd_socket_1'',''on'') else ''Κλειστό'' }} · {{ states(''sensor.bd_socket_1_power'')|float(0)|round(0) }} W'
            icon: mdi:power-socket-eu
            icon_color: '{{ ''amber'' if is_state(''switch.bd_socket_1'',''on'') else ''disabled'' }}'
            tap_action:
              action: toggle
              confirmation:
                text: Η «Πρίζα 1 υπνοδωματίου» καταναλώνει ρεύμα αυτή τη στιγμή. Είσαι σίγουρος ότι θέλεις να την απενεργοποιήσεις;
        - type: conditional
          conditions:
          - condition: not
            conditions:
            - *id001
          card:
            type: custom:mushroom-template-card
            entity: switch.bd_socket_1
            primary: Πρίζα 1 υπνοδωματίου
            secondary: '{{ ''Ανοιχτό'' if is_state(''switch.bd_socket_1'',''on'') else ''Κλειστό'' }} · {{ states(''sensor.bd_socket_1_power'')|float(0)|round(0) }} W'
            icon: mdi:power-socket-eu
            icon_color: '{{ ''amber'' if is_state(''switch.bd_socket_1'',''on'') else ''disabled'' }}'
            tap_action:
              action: toggle
        - type: conditional
          conditions:
          - &id002
            condition: numeric_state
            entity: sensor.bd_socket_2_power
            above: 2
          card:
            type: custom:mushroom-template-card
            entity: switch.bd_socket_2
            primary: Πρίζα 2 υπνοδωματίου
            secondary: '{{ ''Ανοιχτό'' if is_state(''switch.bd_socket_2'',''on'') else ''Κλειστό'' }} · {{ states(''sensor.bd_socket_2_power'')|float(0)|round(0) }} W'
            icon: mdi:power-socket-eu
            icon_color: '{{ ''amber'' if is_state(''switch.bd_socket_2'',''on'') else ''disabled'' }}'
            tap_action:
              action: toggle
              confirmation:
                text: Η «Πρίζα 2 υπνοδωματίου» καταναλώνει ρεύμα αυτή τη στιγμή. Είσαι σίγουρος ότι θέλεις να την απενεργοποιήσεις;
        - type: conditional
          conditions:
          - condition: not
            conditions:
            - *id002
          card:
            type: custom:mushroom-template-card
            entity: switch.bd_socket_2
            primary: Πρίζα 2 υπνοδωματίου
            secondary: '{{ ''Ανοιχτό'' if is_state(''switch.bd_socket_2'',''on'') else ''Κλειστό'' }} · {{ states(''sensor.bd_socket_2_power'')|float(0)|round(0) }} W'
            icon: mdi:power-socket-eu
            icon_color: '{{ ''amber'' if is_state(''switch.bd_socket_2'',''on'') else ''disabled'' }}'
            tap_action:
              action: toggle
        grid_options:
          columns: 12
          rows: auto
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Περισσότερα
        icon: mdi:information-outline
        tap_action:
          action: navigate
          navigation_path: '#g_bedroom_info'
        grid_options:
          columns: 12
    - type: custom:bubble-card
      card_type: pop-up
      hash: '#g_bedroom_info'
      name: Υπνοδωμάτιο · Πληροφορίες
      icon: mdi:information-outline
      grid_options:
        columns: full
      cards:
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:mushroom-template-card
          entity: sensor.bd_light_1_power
          primary: Ισχύς φωτός 1
          secondary: '{{ states(''sensor.bd_light_1_power'') }} W'
          icon: mdi:flash
          icon_color: blue
          tap_action: &id003
            action: more-info
        - type: custom:mushroom-template-card
          entity: sensor.bd_light_ontas_2_power
          primary: Ισχύς φωτός 2
          secondary: '{{ states(''sensor.bd_light_ontas_2_power'') }} W'
          icon: mdi:flash
          icon_color: blue
          tap_action: *id003
        - type: custom:mushroom-template-card
          entity: sensor.wled_gledopto_estimated_current_2
          primary: Ρεύμα WLED
          secondary: '{{ states(''sensor.wled_gledopto_estimated_current_2'') }} mA'
          icon: mdi:current-dc
          icon_color: blue
          tap_action: *id003
        grid_options:
          columns: 12
          rows: auto
      - type: custom:bubble-card
        card_type: button
        button_type: name
        name: Πίσω
        icon: mdi:arrow-left
        tap_action:
          action: navigate
          navigation_path: '#g_bedroom'
        grid_options:
          columns: 12
