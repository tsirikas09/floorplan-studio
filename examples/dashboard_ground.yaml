          {% if st == ''washing'' %}

          ## 🫧 Πλένει τώρα

          Ξεκίνησε **{{ when(start) }}** · τρέχει εδώ και **{{ dur((now().timestamp() - start|float(0)) / 60) }}** · ισχύς **{{ p|round(0)|int }} W**

          {% elif st == ''finished'' %}

