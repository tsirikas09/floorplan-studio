          {% macro when(ts) -%}{% set ts = ts|float(0) %}{% if ts == 0 %}—{% else %}{% set dd = ts|timestamp_custom(''%Y-%m-%d'', true) %}{% if dd == now().strftime(''%Y-%m-%d'') %}Σήμερα{% elif dd == (now()
          - timedelta(days=1)).strftime(''%Y-%m-%d'') %}Χθες{% else %}{{ ts|timestamp_custom(''%d/%m'', true) }}{% endif %} {{ ts|timestamp_custom(''%H:%M'', true) }}{% endif %}{%- endmacro %}

          {% set st = states(''sensor.washer_status'') %}{% set start = state_attr(''input_datetime.washer_last_start'',''timestamp'') %}{% set end = state_attr(''input_datetime.washer_last_end'',''timestamp'')
          %}

