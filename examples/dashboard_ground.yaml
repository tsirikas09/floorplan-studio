          Τέλος **{{ when(end) }}** · διήρκεσε **{{ dur(states(''input_number.washer_last_duration'')) }}** · περιμένει εδώ και {{ dur((now().timestamp() - end|float(0)) / 60) }}. Βγάλε τα ρούχα!

          {% else %}

          ## 💤 Αδρανές

          Τελευταίο πλύσιμο **{{ when(start) }} → {{ when(end) }}** ({{ dur(states(''input_number.washer_last_duration'')) }})

          {% endif %}'
